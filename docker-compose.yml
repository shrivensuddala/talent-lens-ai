services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens
      POSTGRES_DB: talentlens
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentlens -d talentlens"]
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes: [qdrant_data:/qdrant/storage]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://talentlens:talentlens@postgres:5432/talentlens
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deployment}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  qdrant_data:
